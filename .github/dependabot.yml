# Dependabot-konfigurasjon.
#
# Minor- og patch-oppdateringer samles i grupperte PR-er slik at et repo
# gir en håndfull PR-er i uka, ikke en per pakke.
#
# Major-oppdateringer er bevisst holdt UTENFOR gruppene, og kommer derfor
# som en PR per pakke. Det er med vilje: major-hopp krever manuell testing,
# og skal ikke kunne bli med som blindpassasjer i en samle-PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      sikkerhetsoppdateringer:
        applies-to: security-updates
        patterns: ["*"]
      utviklingsavhengigheter:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      produksjonsavhengigheter:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # boardgame.io 0.50.2 støtter ikke React 19, og vedlikeholderen har sagt
      # at det ikke er planlagt (boardgameio/boardgame.io#1215). React 18 har
      # ingen åpne sikkerhetsvarsler, så vi blir der til rammeverket følger
      # etter. Fjern denne når boardgame.io slipper en React 19-kompatibel
      # versjon. Merk at security-updates fortsatt slipper gjennom.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # ESLint 10 er blokkert av eslint-plugin-react, som per august 2026 kun
      # støtter eslint opptil ^9.7 og sist ble publisert i april 2025. Vi kjører
      # eslint 9 med flat config, så hoppet til 10 blir udramatisk den dagen
      # plugin-en følger etter. Fjern denne da.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

