# Kjører lint, tester og build på hver push til main og på alle PR-er.
#
# Poenget er særlig Dependabot-PR-ene: uten dette er en grønn PR fra
# Dependabot bare et løfte om at versjonsnummeret er nyere, ikke at
# oppdateringen faktisk virker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avbryt et pågående løp hvis det kommer en ny push på samme gren.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Samme major som netlify.toml pinner, så CI og deploy bygger likt.
          node-version: "22"
          cache: npm

      # npm ci installerer fra package-lock.json og feiler hvis lockfilen er
      # ute av synk med package.json.
      - run: npm ci

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run build

  # Fletter Dependabot-PR-er automatisk når CI er grønn, men bare minor- og
  # patch-oppdateringer. Major-hopp (også sikkerhetsoppdateringer som er
  # major) blir liggende for manuell testing, i tråd med dependabot.yml.
  # Flettes direkte i stedet for med "gh pr merge --auto", slik at det ikke
  # krever branch protection eller "Allow auto-merge" i repoet.
  dependabot-fletting:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
